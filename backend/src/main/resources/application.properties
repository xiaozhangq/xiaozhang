spring.application.name=backend

# 服务端口（启动后控制台会打印「端口: 8079」）
server.port=8079

# 上传大小限制（单文件与整请求；需与 nginx client_max_body_size 一致或更大）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:ordering_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:jianjing@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 上传目录：生产环境建议使用绝对路径，如 /data/ordering/uploads
app.upload.dir=${UPLOAD_DIR:E:/software/installApplicationDir/nginx-1.27.1/upload}
# 图片访问地址前缀：空则返回相对路径 /uploads/xxx；可配置完整域名如 https://static.example.com
app.upload.base-url=${UPLOAD_BASE_URL:http://127.0.0.1:8065/upload/}
# 是否由 Spring 提供静态访问（使用 Nginx 时设为 false）
app.upload.serve-with-spring=${UPLOAD_SERVE_WITH_SPRING:true}

app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123456}
app.security.jwt-secret=${JWT_SECRET:ordering-system-jwt-secret-at-least-32}
app.security.jwt-expire-minutes=${JWT_EXPIRE_MINUTES:720}


